[package]
name = "baker-desk"
version = "0.1.7"
description = "Baker Desk local-first pastry recipe assistant"
authors = ["Baker Desk"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "baker_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
